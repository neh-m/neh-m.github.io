<!DOCTYPE html>

  <title>Neh Majmudar</title>

  <!-- No-flash theme: apply a saved choice before the page paints. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Style is split by concern. Restyle the whole site from variables.css. -->
  <link rel="stylesheet" href="css/base.css?v=6" />
  <link rel="stylesheet" href="css/variables.css?v=6" />
  <link rel="stylesheet" href="css/layout.css?v=6" />
  <link rel="stylesheet" href="css/nav.css?v=6" />
  <link rel="stylesheet" href="css/content.css?v=6" />
  <link rel="stylesheet" href="css/social.css?v=6" />
</head>

<!-- .preload suppresses transitions for the first paint. -->
<body class="preload">

  <!-- The avatar + name sit at the top and scroll away.
       Swap assets/avatar.svg for your own photo. -->
  <header class="lead">
    <img class="avatar" src="assets/avatar.jpg" alt="Neh Majmudar" width="200" height="200" />
    <h1 class="name" id="name">Neh Majmudar</h1>
  </header>

  <!-- Sticky nav: sits just under the name, then pins to the top on scroll. -->
  <nav class="nav" aria-label="Primary">
    <a class="nav__link" href="#about"    data-route="about">About</a>
    <a class="nav__link" href="#research" data-route="research">Research</a>
    <a class="nav__link" href="#projects" data-route="projects">Projects</a>
    <!-- Blog is parked until there are articles to show.
    <a class="nav__link" href="#blog"     data-route="blog">Blog</a>
    -->
  </nav>

  <!-- Empty shells. Content is filled by render.js from the content/ data files. -->
  <main class="content">
    <section class="section section--about" id="about"></section>
    <section class="section" id="research"></section>
    <section class="section" id="projects"></section>
    <!-- Blog is parked until there are articles to show.
    <section class="section" id="blog"></section>
    -->
  </main>
